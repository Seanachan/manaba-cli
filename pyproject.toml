[project]
name = "manaba-cli"
version = "0.1.0"
description = "Read-only CLI for agents and humans to read manaba (courses, deadlines, news, contents)."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Seanachan", email = "72599785+Seanachan@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "playwright>=1.64.0",
    "rich>=15.0.0",
    "selectolax>=1.0.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.3",
]

[project.scripts]
manaba = "manaba_cli.cli:main"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# manaba is a Japanese UI: fullwidth characters in strings and comments are intended.
ignore = ["RUF001", "RUF002", "RUF003"]
